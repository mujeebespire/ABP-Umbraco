
<div class="content">
	<div class="image">
		<img src="inline/img/info/multideck.jpg" alt="#">
		<div class="label automotive"><p>Automotive</p></div>
	</div>
	<div class="text lightbox-scroll">
		<div class="text-inner">
			<h3>Multi-decks (Western Docks)</h3>
			<p>We have eight multi-deck car storage facilities in the Port to provide 50,000 car parking spaces for automotive storage. The multi-decks are located mainly in the Eastern docks with one in the Western Docks next to Horizon Cruise Terminal.</p>
		</div>	
		<div class="gradient"></div>	
		<a class="scroll-down"></a>		
	</div>
</div>

<script>
$(document).ready(function() {
    function checkScrollPositionLightbox() {
        var scrollDiv = $('.lightbox-scroll');
        var scrollHeight = scrollDiv.prop('scrollHeight');
        var divHeight = scrollDiv.height();
        var currentScrollTop = scrollDiv.scrollTop();
        
        if (currentScrollTop + divHeight >= scrollHeight || scrollHeight <= divHeight) {
            $('.scroll-down').hide();
        } else {
            $('.scroll-down').show();
        }
    }

    $('.scroll-down').on('click', function() {
        var scrollDiv = $('.lightbox-scroll');
        var currentScrollTop = scrollDiv.scrollTop();
        
        scrollDiv.animate({
            scrollTop: currentScrollTop + 200
        }, 400, function() {
            checkScrollPositionLightbox();
        });
    });

    $('.lightbox-scroll').on('scroll', function() {
        checkScrollPositionLightbox();
    });

    // Initial check in case the content is already scrolled or doesn't need scrolling
    checkScrollPositionLightbox();

});
</script>
